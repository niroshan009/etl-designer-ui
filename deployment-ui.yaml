apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-designer-ui
  namespace: spark
  labels:
    app: etl-designer-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etl-designer-ui
  template:
    metadata:
      labels:
        app: etl-designer-ui
    spec:
      containers:
      - name: etl-designer-ui
        image: niroshan009/etl-designer-ui:latest
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1024Mi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: etl-designer-ui-service
  namespace: spark
spec:
  type: NodePort
  selector:
    app: etl-designer-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
